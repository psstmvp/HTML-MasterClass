<!-- Program: Hyperlink Tag -->

<!DOCTYPE html>
<html lang="en">

<head>

	<title>Hyperlink Tag</title>

</head>

<body>

	<h1 id="top">Hyperlink Tag</h1>
	<!-- Main heading of the webpage -->

	<!-- <a> is used to create a hyperlink that connects one webpage to another -->

	<h2>1. Linking to Another Page (Relative Link)</h2>
	<p>
		<a href="Class-1-HTML_Document_Structure.html">Click Here to Open Class 1</a>
	</p>

	<h2>2. External Link (Absolute URL)</h2>
	<p>
		<a href="https://www.google.com" target="_blank">Search on Google</a>
	</p>

	<h2>3. Email and Phone Links</h2>
	<p>
		<a href="mailto:info@example.com">Send Email</a><br><br>
		<a href="tel:+919876543210">Call Us</a>
	</p>

	<hr>

	<h2>4. Bookmark Link</h2>
	<p>
		<a href="#section-bottom">Jump to Bottom</a>
	</p>

	<p style="margin-top: 150px;" id="section-bottom">
		<b>You have reached the bottom section!</b><br>
		<a href="#top">Back to Top</a>
	</p>

	<!--
        Hyperlink Attributes

        What is it for:
        Used to connect web documents together, enabling visitors to navigate
        between pages, open external sites, launch email/phone apps, or jump
        to specific bookmark sections on the same page.

        Tag & Attributes:
        <a>            : Anchor tag used to create hyperlinks.
        href           : Destination webpage, file, or URL.
        target="_blank": Opens the linked page in a new browser tab.
        mailto:        : Opens user's email client.
        tel:           : Opens phone dialer.
        href="#id"     : In-page bookmark jump.
    -->

</body>

</html>
