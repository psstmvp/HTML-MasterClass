<!-- Program: Semantic HTML Layout -->

<!DOCTYPE html>
<html lang="en">

<head>

    <title>Semantic HTML Layout</title>

</head>

<body>

    <!-- <header> represents the top header or logo area -->
    <header style="border: 1px solid blue; padding: 10px;">
        <h1>Website Header</h1>
        <p>Site Title &amp; Banner</p>
    </header>

    <br>

    <!-- <nav> contains navigation links -->
    <nav style="border: 1px solid green; padding: 10px;">
        <a href="#home">Home</a> | 
        <a href="#about">About</a> | 
        <a href="#contact">Contact</a>
    </nav>

    <br>

    <!-- <main> holds the main unique content of the page -->
    <main style="border: 1px solid red; padding: 10px;">

        <!-- <section> represents a section of related content -->
        <section>
            <h2>Main Section Heading</h2>

            <!-- <article> represents an independent self-contained article -->
            <article>
                <h3>Article Title</h3>
                <p>Semantic elements give clear meaning to the browser and developer.</p>
            </article>
        </section>

        <!-- <aside> represents a sidebar or related information -->
        <aside>
            <h4>Sidebar</h4>
            <p>Related links and news.</p>
        </aside>

    </main>

    <br>

    <!-- <footer> represents the footer area -->
    <footer style="border: 1px solid gray; padding: 10px;">
        <p>Copyright &copy; 2026 Web Development</p>
    </footer>

    <!--
        Semantic HTML Layout Elements

        What is it for:
        Used to provide clear structural meaning to page regions (header, navigation,
        main body, sidebars, and footer) for search engines (SEO) and screen readers.

        Tags:
        <header>  : Defines a header for document or section.
        <nav>     : Defines navigation links.
        <main>    : Defines dominant content of document (only one per page).
        <section> : Defines a thematic section.
        <article> : Defines an independent, self-contained article.
        <aside>   : Defines content aside from the main content (sidebar).
        <footer>  : Defines a footer for document or section.
    -->

</body>

</html>
