<!-- Program: HTML Table -->

<html>

<head>

  <title>HTML Table</title>

</head>

<body>

  <h1>HTML Table</h1>
  <!-- Main heading of the webpage -->

  <p><b>HTML Table Tags</b></p>

  <ul>
    <li>&lt;table&gt; - Defines a table</li>
    <li>&lt;tr&gt; - Defines a table row</li>
    <li>&lt;th&gt; - Defines a table heading</li>
    <li>&lt;td&gt; - Defines table data (cell)</li>
  </ul>

  <hr>

  <!-- <table> is used to create a table -->

  <table border="1" width="500" cellpadding="5" cellspacing="2">

    <tr>
      <th>Roll No</th>
      <th>Name</th>
      <th>Mark</th>
    </tr>

    <tr>
      <td width="100">1</td>
      <td>Arun</td>
      <td>450</td>
    </tr>

    <tr>
      <td>2</td>
      <td>Jose</td>
      <td>550</td>
    </tr>

  </table>

  <!--
        HTML Table Attributes

        What is it for:
        Used to display structured tabular data arranged in rows and columns
        (such as marksheets, pricing matrices, and reports).

        Tags & Attributes:
        <table>     : Container for tabular data.
        <tr>        : Table row element.
        <th>        : Table header cell (bold and centered by default).
        <td>        : Table data cell.
        border      : Specifies the border thickness of the table.
        width       : Specifies the width of the table in pixels or percent.
        cellpadding : Specifies space between cell content and border.
        cellspacing : Specifies space between neighboring table cells.
        align       : Specifies alignment of table (left, center, right).
    -->

</body>

</html>
