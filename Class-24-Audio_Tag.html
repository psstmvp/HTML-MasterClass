<!-- Program: Audio Tag -->

<!DOCTYPE html>
<html lang="en">

<head>

    <title>Audio Tag</title>

</head>

<body>

    <h1>Audio Tag</h1>
    <!-- Main heading of the webpage -->

    <!-- <audio> is used to embed audio files in HTML -->

    <audio controls>
        <!-- <source> specifies the file and format -->
        <source src="Media/sample.mp3" type="audio/mpeg">
        <source src="Media/sample.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <p><i>Transcript: Welcome to the HTML audio lesson.</i></p>

    <!--
        Audio Tag Attributes

        What is it for:
        Used to embed sound files, songs, podcasts, and audio clips directly into a webpage
        with native playback controls, without needing third-party plugins.

        Attributes:
        controls : Adds play, pause, volume, and seek controls.
        autoplay : Automatically starts playing when page loads.
        loop     : Automatically replays the audio file.
        muted    : Starts playback with audio muted.
        preload  : "none", "metadata", or "auto" buffering strategy.
    -->

</body>

</html>
