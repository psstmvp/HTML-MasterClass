<!-- Program: SPAN Tag -->

<!DOCTYPE html>
<html lang="en">

<head>

    <title>SPAN Tag</title>

</head>

<body>

    <h1>SPAN Tag</h1>
    <!-- Main heading of the webpage -->

    <p>
        The &lt;span&gt; tag is an inline container used to mark up or style a part of text.
    </p>

    <hr>

    <p>
        HTML is <span style="color: blue; font-weight: bold;">easy</span> to learn and
        <span style="color: green; font-weight: bold;">fun</span> to use!
    </p>

    <p>
        Product Status: <span style="background-color: lightgreen; padding: 3px;">In Stock</span>
    </p>

    <!--
        <span> Tag

        What is it for:
        Used as a generic inline container to style or script specific words, phrases,
        or portions of text inside a block without breaking the natural flow onto a new line.

        Key Notes:
        - The <span> tag is an inline element (does NOT start on a new line).
        - Used to apply styles (color, font, background) to a specific word or phrase inside a paragraph.
    -->

</body>

</html>
