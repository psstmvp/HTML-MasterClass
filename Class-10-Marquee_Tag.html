<!-- Program: Marquee Tag -->

<html>

<head>

	<title>Marquee Tag</title>

</head>

<body>

	<h1>Marquee Tag</h1>
	<!-- Main heading of the webpage -->

	<marquee direction="left" loop="infinite" behavior="scroll" scrollamount="10">
		Welcome to HTML Programming
	</marquee>

	<h3>Marquee Attributes</h3>

	<p>
		<b>direction</b> : left, right, up, down <br><br>

		<b>loop</b> : infinite or 1, 2, 3, ... <br><br>

		<b>behavior</b> : scroll, alternate, slide <br><br>

		<b>scrollamount</b> : Controls the speed of the moving content.
	</p>

	<!--
        Marquee Tag Notes

        What is it for:
        Historically used in older websites to create auto-scrolling ticker text
        or moving banners across the screen in various directions.

        Tag & Attributes:
        <marquee>    : Container for moving text or images.
        direction    : Scroll direction (left, right, up, down).
        loop         : How many times to repeat (infinite or a number).
        behavior     : Motion style (scroll, slide, alternate).
        scrollamount : Speed of motion in pixels per frame.

        Modern Note: In modern web development, smooth animations
        are created using CSS animations instead of <marquee>.
    -->

</body>

</html>
