<!-- Program: HTML Heading Tags -->

<!DOCTYPE html>
<html lang="en">

<head>

	<title>HTML Heading Tags</title>

</head>

<body>

	<h1>HTML Heading Tags</h1>
	<!-- Main heading of the webpage -->

	<h1>Welcome</h1>
	<h2>Welcome</h2>
	<h3>Welcome</h3>
	<h4>Welcome</h4>
	<h5>Welcome</h5>
	<h6>Welcome</h6>
	<!-- HTML provides six levels of headings, from <h1> (largest) to <h6> (smallest). -->

	<!--
        Heading Tags

        What is it for:
        Heading tags structure the outline and visual hierarchy of a webpage,
        guiding users, search engines, and screen readers through main topics
        and subsections from h1 down to h6.

        Tags:
        <h1> : Highest level heading (main page topic - use once per page).
        <h2> : Second level heading (main section title).
        <h3> : Third level heading (subsection title).
        <h4> : Fourth level heading.
        <h5> : Fifth level heading.
        <h6> : Lowest level heading.
    -->

</body>

</html>
