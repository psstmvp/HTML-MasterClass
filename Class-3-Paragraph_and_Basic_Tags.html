<!-- Program: Paragraph and Basic Tags -->

<!DOCTYPE html>
<html lang="en">

<head>

	<title>Paragraph and Basic Tags</title>

</head>

<body>

	<h1>Paragraph and Basic Tags</h1>
	<!-- Main heading of the webpage -->

	<p>This is the first paragraph. HTML paragraphs automatically include space above and below.</p>
	<!-- <p> defines a paragraph of text -->

	<p>This is the second paragraph demonstrating separate text blocks.</p>

	<hr>
	<!-- <hr> inserts a horizontal line (thematic divider) -->

	<h2>Line Breaks and Address</h2>

	<p>
		First line of address<br>
		Second line of address<br>
		City and Pincode
	</p>
	<!-- <br> inserts a single line break without starting a new paragraph -->

	<!-- This is an HTML comment. Comments are not displayed in the browser. -->

	<!--
        Basic HTML Tags

        What is it for:
        Used for fundamental text content and spacing: paragraphs group sentences,
        line breaks wrap lines within an address or poem, horizontal rules divide
        sections, and comments leave notes for programmers.

        Tags:
        <p>         : Paragraph tag used for blocks of text.
        <hr>        : Horizontal rule / divider line (empty/void tag).
        <br>        : Line break tag (empty/void tag, no closing tag).
        Comments    : Used to add notes for developers (ignored by the browser).
    -->

</body>

</html>
