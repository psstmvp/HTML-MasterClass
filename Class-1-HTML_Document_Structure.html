<!-- Program: HTML Document Structure and Head Metadata -->

<!DOCTYPE html>
<!-- <!DOCTYPE html> declares the document as HTML5 -->

<html lang="en">
<!-- <html> is the root element. lang="en" specifies English as language -->

<head>
    <!-- <head> contains machine-readable metadata and page resources -->

    <meta charset="UTF-8">
    <!-- Sets character encoding to UTF-8 for international characters and symbols -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sets viewport for mobile responsive display on all screen sizes -->

    <meta name="description" content="HTML beginner course teaching document structure and metadata.">
    <!-- Description used by search engines in results snippets -->

    <meta name="author" content="PSST">
    <!-- Specifies the author of the document -->

    <title>HTML Document Structure</title>
    <!-- Displays the webpage title in the browser tab -->

    <link rel="icon" type="image/jpg" href="Images/Desert.jpg">
    <!-- Sets the favicon icon displayed next to the title in the browser tab -->

    <!-- Linking external CSS stylesheet -->
    <!-- <link rel="stylesheet" href="style.css"> -->

    <!-- Linking external JavaScript file -->
    <!-- <script src="script.js" defer></script> -->

</head>

<body>
    <!-- Contains all the visible content displayed on the webpage -->

    <h1>HTML Document Structure</h1>
    <!-- Main heading of the webpage -->

    <p>Every modern HTML5 webpage follows this standard boilerplate structure.</p>

    <!--
        Document Structure & Head Metadata

        What is it for:
        Provides the foundational boilerplate required for every webpage,
        supplying browser configurations, mobile viewport scaling, metadata,
        and setting up the visible page container.

        Tags:
        <!DOCTYPE html> : Informs browser this is an HTML5 document.
        <html lang="en">: Root element of the page.
        <head>          : Container for metadata, title, and linked resources.
        <meta charset>  : UTF-8 character encoding.
        <meta viewport> : Configures page width and scale for mobile devices.
        <meta name="">  : Page metadata (description, author, keywords).
        <title>         : Page title in browser tab.
        <link>          : Links external resources like tab favicons and CSS stylesheets.
        <script>        : Connects JavaScript files to the page.
        <base>          : Specifies default URL/target for all relative URLs on the page.
        <body>          : All visible content goes inside body.
    -->

</body>

</html>
