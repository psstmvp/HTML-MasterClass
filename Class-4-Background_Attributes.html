<!-- Program: Background Attributes -->

<html>

<head>

	<title>Background Attributes</title>

</head>

<body bgcolor="lightblue" background="Images/Desert.jpg">
	<!-- bgcolor sets the background color of the webpage -->
	<!-- background sets an image as the webpage background -->

	<h1>Background Attributes</h1>
	<!-- Main heading of the webpage -->

	<h2>Welcome</h2>
	<h3>Welcome</h3>
	<h4>Welcome</h4>
	<h5>Welcome</h5>
	<h6>Welcome</h6>

	<!--
        Background Attributes

        What is it for:
        Used on the <body> tag to customize the visual backdrop of a webpage,
        either with a solid background color or a tiled image.

        Attributes:
        bgcolor    : Sets the background color of the webpage.
        background : Sets an image path as the webpage background.

        Modern Note: In modern HTML5, background colors and images
        are set using CSS (e.g. style="background-color: lightblue;").
    -->

</body>

</html>
